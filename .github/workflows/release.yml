name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o primortal${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/launcher
      
      - name: Package release
        run: |
          mkdir -p release
          cp primortal${{ matrix.goos == 'windows' && '.exe' || '' }} release/
          cp -r assets release/
          cp -r game_data release/
          cp README.md release/ || true
      
      - name: Create archive
        run: |
          cd release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a ../primortal_${{ matrix.goos }}_${{ matrix.goarch }}.zip *
          else
            tar -czf ../primortal_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz *
          fi
        shell: bash
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            primortal_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}