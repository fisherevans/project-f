name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w -X 'fisherevans.com/project/f/internal/setup.Version=${{ github.ref_name }}' -X 'fisherevans.com/project/f/internal/setup.Commit=${{ github.sha }}'" -o primortal${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/release
      
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          cp primortal${{ matrix.goos == 'windows' && '.exe' || '' }} release/
          cp RUNNING.md release/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp scripts/run_windows.bat release/
          else
            cp scripts/run_macos.sh release/
            chmod +x release/run_macos.sh
          fi
      
      - name: Create archive
        run: |
          cd release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a ../primortal_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip *
          else
            tar -czf ../primortal_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz *
          fi
        shell: bash
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            primortal_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}