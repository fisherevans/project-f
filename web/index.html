<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Primortal</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            outline: none;
            background: #000;
        }
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 10;
            transition: opacity 400ms ease-out;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #ddd;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loader .title {
            font-size: 18px;
            letter-spacing: 2px;
            color: #ccc;
            text-transform: uppercase;
        }
        #loader .status {
            font-size: 13px;
            color: #888;
            min-height: 1em;
        }
        #loader .bar {
            width: 280px;
            height: 4px;
            background: #222;
            overflow: hidden;
        }
        #loader .bar-fill {
            height: 100%;
            background: #888;
            width: 0%;
            transition: width 120ms linear;
        }
        #loader.indeterminate .bar-fill {
            width: 40% !important;
            animation: slide 1.2s ease-in-out infinite;
            transition: none;
        }
        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        #loader.indeterminate .status::after {
            content: "";
            display: inline-block;
            width: 1.2em;
            text-align: left;
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
            100% { content: ""; }
        }
        #start-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10;
            cursor: pointer;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: opacity 400ms ease-out;
        }
        #start-screen.visible { display: flex; }
        #start-screen.hidden { opacity: 0; pointer-events: none; }
        #start-screen .title {
            font-size: 18px;
            letter-spacing: 2px;
            color: #ccc;
            text-transform: uppercase;
        }
        #start-screen .prompt {
            font-size: 12px;
            letter-spacing: 3px;
            color: #999;
            text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50%       { opacity: 1.0; }
        }
        #ctx-lost {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #ddd;
            text-align: center;
            padding: 24px;
        }
        #ctx-lost.visible { display: flex; }
        #ctx-lost .msg { font-size: 14px; color: #aaa; }
        #ctx-lost button {
            font-family: inherit;
            font-size: 13px;
            background: #555;
            color: #ddd;
            border: none;
            padding: 10px 28px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="game" tabindex="0" style="touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;"></canvas>
    <div id="ctx-lost">
        <div class="msg">Graphics context lost.<br>This can happen when the device runs low on GPU memory.</div>
        <button onclick="location.reload()">Reload</button>
        <div id="ctx-lost-diag" style="font-size:10px;color:#555;max-width:320px;word-break:break-all;"></div>
    </div>
    <div id="loader">
        <div class="title">Primortal</div>
        <div class="bar"><div class="bar-fill" id="loader-bar"></div></div>
        <div class="status" id="loader-status">Starting&hellip;</div>
    </div>
    <div id="start-screen">
        <div class="title">Primortal</div>
        <div class="prompt">Press to play</div>
    </div>
    <script src="build_info.js"></script>
    <script src="wasm_exec.js"></script>
    <script>
        // WebGL context-lost bridge: pixel calls this instead of auto-reloading.
        window.pixelOnContextLost = (diag) => {
            document.getElementById("ctx-lost").classList.add("visible");
            if (diag) {
                const elapsed = diag.elapsedMs ? (diag.elapsedMs / 1000).toFixed(1) + "s" : "?";
                const mem = (diag.backingW && diag.backingH)
                    ? (diag.backingW * diag.backingH * 4 / 1024 / 1024).toFixed(1) + " MB framebuffer"
                    : "";
                const parts = [
                    diag.renderer || "unknown GPU",
                    `DPR ${diag.dpr}`,
                    `${diag.backingW}x${diag.backingH}`,
                    mem,
                    `after ${elapsed}`,
                    diag.count > 1 ? `(#${diag.count})` : "",
                ].filter(Boolean);
                document.getElementById("ctx-lost-diag").textContent = parts.join(" - ");
                console.warn("context lost diag:", diag);
            }
        };

        // Cursor visibility bridge: Go calls this to hide/show the cursor when idle.
        window.primortalSetCursorVisible = (visible) => {
            document.getElementById("game").style.cursor = visible ? "default" : "none";
        };

        // Fullscreen bridge called from the Go overlay with the desired state.
        // Requesting on the document element covers the full viewport on mobile.
        // Guard with document.fullscreenEnabled: on iOS Safari requestFullscreen
        // is undefined, and calling it throws a TypeError that propagates back
        // through syscall/js and panics the game goroutine (audio survives).
        window.primortalToggleFullscreen = (wantFullscreen) => {
            if (!document.fullscreenEnabled) return;
            try {
                if (wantFullscreen && !document.fullscreenElement) {
                    document.documentElement.requestFullscreen({ navigationUI: "hide" })
                        .catch(e => console.warn("fullscreen:", e));
                } else if (!wantFullscreen && document.fullscreenElement) {
                    document.exitFullscreen();
                }
            } catch (e) {
                console.warn("fullscreen:", e);
            }
        };

        // Alt+Enter shortcut for desktop convenience.
        window.addEventListener("keydown", (e) => {
            if (e.altKey && e.key === "Enter" && document.fullscreenEnabled) {
                e.preventDefault();
                window.primortalToggleFullscreen(!document.fullscreenElement);
            }
        });

        // Crash diagnostics via localStorage heartbeat.
        // If iOS kills the tab (OOM), no JS runs on exit so pixelOnContextLost
        // never fires. Instead we write a heartbeat every 5s and check for a
        // stale one on the next load to detect tab kills vs clean exits.
        const CRASH_KEY = "primortal_heartbeat";
        (() => {
            let prev = null;
            try { prev = JSON.parse(localStorage.getItem(CRASH_KEY)); } catch(e) {}
            if (prev && prev.running) {
                // Previous session was killed without a clean exit.
                // Log each field individually so Safari doesn't truncate them.
                const age = ((Date.now() - prev.ts) / 1000).toFixed(0);
                console.warn("=== primortal crash detected ===");
                console.warn("uptime:   " + (prev.uptime || "?") + "s");
                console.warn("canvas:   " + (prev.canvasW || "?") + "x" + (prev.canvasH || "?"));
                console.warn("dpr:      " + (prev.dpr || "?"));
                console.warn("renderer: " + (prev.renderer || "unknown"));
                console.warn("age:      " + age + "s ago");
                console.warn("================================");
                const parts = [
                    "Previous session ended unexpectedly",
                    prev.renderer ? `GPU: ${prev.renderer}` : null,
                    prev.canvasW ? `canvas: ${prev.canvasW}x${prev.canvasH}` : null,
                    prev.dpr ? `DPR: ${prev.dpr}` : null,
                    prev.uptime ? `uptime: ${prev.uptime}s` : null,
                    `(${age}s ago)`,
                ].filter(Boolean).join(" - ");
                window._lastCrashDiag = parts;
            }
            // Clear on each fresh load so we start clean.
            localStorage.removeItem(CRASH_KEY);
        })();

        // Called by Go once assets are loaded and the game is ready to start.
        // Go blocks on primortalStart() being called, so we show the start screen
        // here and let the user gesture unblock the game loop (and audio).
        window.primortalOnReady = null; // redefined below after DOM refs are captured

        (async () => {
            const loader      = document.getElementById("loader");
            const bar         = document.getElementById("loader-bar");
            const status      = document.getElementById("loader-status");
            const startScreen = document.getElementById("start-screen");

            const setStatus        = (t) => { status.textContent = t; };
            const setProgress      = (p) => { bar.style.width = Math.max(0, Math.min(100, p)) + "%"; };
            const setIndeterminate = (on) => { loader.classList.toggle("indeterminate", on); };

            window.primortalOnReady = () => {
                // Hide the loader and show the start screen. Go is blocking on
                // primortalStart(), so the game loop hasn't started yet.
                setIndeterminate(false);
                setProgress(100);
                loader.classList.add("hidden");
                setTimeout(() => loader.remove(), 500);
                startScreen.classList.add("visible");

                // Expose last crash diag in the ctx-lost overlay if it fires.
                if (window._lastCrashDiag) {
                    const el = document.getElementById("ctx-lost-diag");
                    if (el) el.textContent = window._lastCrashDiag;
                }
            };

            // Any tap or keypress on the start screen unblocks Go and starts the game.
            const startGame = () => {
                if (!startScreen.classList.contains("visible")) return;
                startScreen.classList.add("hidden");
                setTimeout(() => startScreen.remove(), 500);

                const canvas = document.getElementById("game");

                // Explicitly resume the AudioContext from within this user gesture
                // before unblocking Go. Relying on event bubbling to document alone
                // is unreliable inside iframes where the first click focuses the
                // frame rather than propagating as a gesture to the audio system.
                if (typeof window.primortalResumeAudio === "function") {
                    window.primortalResumeAudio();
                }

                // Call the bridge registered by Go's signalReady to unblock the game loop.
                if (typeof window.primortalStart === "function") {
                    window.primortalStart();
                }

                canvas.focus();

                // Warn before navigating away so players don't lose progress.
                window.addEventListener("beforeunload", (e) => {
                    e.preventDefault();
                    return "";
                });

                // Start heartbeat. Writes canvas size + DPR + uptime every 5s
                // so an OOM tab-kill leaves readable state in localStorage.
                const startTs = Date.now();
                const writeHb = () => {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const rec = {
                        running:  true,
                        ts:       Date.now(),
                        uptime:   ((Date.now() - startTs) / 1000).toFixed(0),
                        canvasW:  canvas.width,
                        canvasH:  canvas.height,
                        dpr:      dpr,
                        renderer: window._gpuRenderer || null,
                    };
                    try { localStorage.setItem(CRASH_KEY, JSON.stringify(rec)); } catch(e) {}
                };
                writeHb();
                setInterval(writeHb, 5000);
            };

            startScreen.addEventListener("click",   startGame);
            startScreen.addEventListener("touchend", (e) => { e.preventDefault(); startGame(); });
            window.addEventListener("keydown", (e) => {
                // Only trigger on Enter or Space; ignore anything with modifier keys
                // held so alt-tab / cmd-tab switching doesn't accidentally start.
                if ((e.key === "Enter" || e.key === " ") && !e.altKey && !e.metaKey && !e.ctrlKey) {
                    startGame();
                }
            });

            window.primortalOnProgress = (stage, current, total) => {
                setIndeterminate(false);
                if (total > 0) {
                    const frac = current / total;
                    setProgress(90 + frac * 10);
                    setStatus(stage + " " + current + "/" + total);
                } else {
                    setIndeterminate(true);
                    setStatus(stage || "Loading");
                }
            };

            try {
                setStatus("Downloading…");
                const resp = await fetch("main.wasm");
                if (!resp.ok) throw new Error("fetch failed: " + resp.status);

                const headerLen = Number(resp.headers.get("Content-Length")) || 0;
                const bakedLen  = (window.primortalBuildInfo && window.primortalBuildInfo.wasmSize) || 0;
                const total     = headerLen || bakedLen;

                let received = 0;
                const reader = resp.body.getReader();
                const chunks = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    if (total > 0) {
                        const frac = Math.min(1, received / total);
                        setProgress(frac * 90);
                        setStatus("Downloading " + Math.floor(frac * 100) + "%");
                    } else {
                        setStatus("Downloading " + (received / (1024 * 1024)).toFixed(1) + " MB");
                    }
                }

                const bytes = new Uint8Array(received);
                let offset = 0;
                for (const c of chunks) { bytes.set(c, offset); offset += c.length; }

                setStatus("Compiling");
                setIndeterminate(true);
                const go = new Go();
                await new Promise(r => setTimeout(r, 0));
                const result = await WebAssembly.instantiate(bytes, go.importObject);

                setStatus("Loading assets");
                go.run(result.instance);
            } catch (err) {
                console.error(err);
                setStatus("Error: " + err.message);
            }
        })();
    </script>
</body>
</html>
