tilesheet:
  tileWidth: 36
  tileHeight: 36
animations:
  closed:
    h_sequence:
      row: 1
      fromColumn: 1
      toColumn: 6
    framesPerSecond: 12
    repeat: false
  open:
    h_sequence:
      row: 1
      fromColumn: 6
      toColumn: 1
    framesPerSecond: 12
    repeat: false
  waves:
    h_sequence:
      row: 2
      fromColumn: 1
      toColumn: 3
    framesPerSecond: 4
    randomize: true