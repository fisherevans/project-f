consts:
  guard_deny_messages:
    - "Sorry, restricted zone. You'll need clearance to pass."
    - "Hold up - your ID's not on the list."
    - "Access denied. You know the rules."
    - "You've been flagged for repeated entry attempts."
    - "Central already notified us about you."
    - "You're persistent, I'll give you that."
    - "Security's keeping an eye on your route."
    - "Still not authorized. Try the proper channels."
    - "You're on record, just so you know."
    - "Another attempt? You're starting to stand out."
    - "Command says to remind you this area is sealed."
    - "We've got your ID tagged facility-wide now."
    - "You must really like closed doors."
    - "Everyone's been briefed about your tours."
    - "You're not going to find a guard who says yes."
    - "You're pushing your luck here."
    - "They told us to expect you."
    - "Next stop's a security report if you keep at it."
    - "You've officially become a training example."
    - "You're done here. Move along."
  guard_chat_dialogues:
    - "Everything in order, recruit? Stay clear of restricted zones."
    - "You again? Don't wander too close to the barriers."
    - "I've seen your name on a few access logs. Keep it clean."
    - "You're getting a reputation for curiosity. That's not a compliment."
    - "You've tested every guard in this facility. Maybe take a hint."
  hall_npc_chatters:
    - "I respect curiosity. I just don't have time for it right now."
    - "If it's not urgent, take it to your supervisor, not me."
    - "You're not cleared for curiosity yet, kid. Stick to your assignments."
    - "Whatever you're thinking, don't. Trust me, it's not worth the paperwork."
    - "You're asking the wrong person, and probably at the wrong time."
    - "Don't worry, we were all clueless once. Some of us still are."
    - "Curiosity's fine. Just don't make it my problem."
    - "You're eager. That'll fade after the first audit."
    - "Ask your mentor before you start poking at things."
    - "Whatever you heard, forget it. You'll sleep better."
    - "That question sounds expensive. I'd drop it."
    - "Keep that energy. The system loves optimism - at first."
    - "You're not in trouble yet. Emphasis on yet."
    - "The less you know, the longer you last here."
    - "If you value sanity, stay out of the details."
    - "First day? You'll stop asking by the third."
    - "Everyone starts curious. Then the reports pile up."
    - "Save the questions for someone still enthusiastic."
    - "Don't look at me like I have answers."
    - "I admire initiative. I also ignore it."
    - "You'll learn fast. Or not at all."
    - "Be careful what you notice. It notices back."
    - "Advice? Stop asking for advice."
    - "The rules change faster than explanations."
    - "Curiosity's contagious. Try not to spread it."
  not_your_paper_messages:
    - "This isn't my paper... I probably shouldn't touch it."
    - "Still not my paper."
    - "Yep, definitely not mine."
    - "Why am I even looking at this."
    - "Someone's gonna think I'm snooping."
    - "I really should stop touching things that aren't mine."
    - "This is getting weirdly habitual."
    - "I swear I'm not a thief, just nosy."
    - "Okay, this is a problem."
    - "Fine, it's not mine, I'll stop... probably"
  hall_npc_targets:
    - "intro.hall_way_end.west"
    - "intro.hall_way_end.north"
    - "intro.hall_way_end.east"

custom_actions:
  guarded_entry_deny:
    description: "Escalating guard denial with player pushback"
    params:
      - name: walk_back_direction
        description: "Direction to push player (up/down/left/right)"
    steps:
      - focused_sequence:
          target: "{{player}}"
          move_camera: true
          face_player: true
          effects:
            - pick_dialogue:
                list: guard_deny_messages
                select: capped
                counter_key: intro.do_not_enter.attempts
                increment: false
          post_effects:
            - trigger_movement:
                entity: "{{player}}"
                direction: "{{param.walk_back_direction}}"
            - set_global:
                key: intro.do_not_enter.attempts
                value: "{{global.intro.do_not_enter.attempts + 1}}"

  guarded_entry_chat:
    description: "Guard chat with escalating familiarity"
    steps:
      - focused_sequence:
          target: "{{player}}"
          effects:
            - pick_dialogue:
                list: guard_chat_dialogues
                select: capped
                counter_key: intro.do_not_enter.attempts
                increment: false

  hall_npc_random_chatter:
    description: "Hallway NPC faces player and delivers random chatter"
    steps:
      - push_behavior:
          entity: "{{self}}"
          facing_entity: "{{player}}"
      - pick_chatter:
          list: hall_npc_chatters
          entity: "{{self}}"
          duration: 3
          select: random
      - pop_behavior: "{{self}}"

  hall_npc_start_random_motion:
    description: "Start NPC walking to a random hallway endpoint"
    params:
      - name: was_canceled
        description: "If true, add a random delay before starting"
        default: false
    steps:
      - if:
          when: "param.was_canceled"
          then:
            - timer: "{{randf() * 3}}"
      - scripted_motion:
          entity: "{{self}}"
          to_entity: "{{const.hall_npc_targets[rand(len(const.hall_npc_targets))]}}"

  indexed_self_dialogue:
    description: "Show cycling self-dialogue from a data list"
    params:
      - name: list
        description: "Data list name for messages"
      - name: counter_key
        description: "Run state key tracking attempt count"
    steps:
      - pick_self_dialogue:
          list: "{{param.list}}"
          select: cycling
          counter_key: "{{param.counter_key}}"

  pick_up_paper:
    description: "Pick up a paper entity with context-dependent dialogue"
    params:
      - name: attempts_key
        description: "Run state key tracking wrong-paper attempts"
      - name: entity_id
        description: "Entity ID of the paper to delete"
    steps:
      - if:
          when: "global[param.attempts_key] == 0 || !hasKey(global, param.attempts_key)"
          then:
            - self_dialogue: "Okay, I've got my papers. I need to give them to the instructor."
          else:
            - if:
                when: "int(global[param.attempts_key]) < 3"
                then:
                  - self_dialogue: "Oh good, this one's actually mine. That shouldn't have been so hard."
                else:
                  - self_dialogue: "Ah, the elusive papers that are actually mine."
      - delete_entity: "{{param.entity_id}}"
      - set_global:
          key: intro.has_papers
          value: true

  turn_in_papers:
    description: "Turn in papers to the instructor with context-dependent dialogue"
    params:
      - name: attempts_key
        description: "Run state key tracking wrong-paper attempts"
    steps:
      - focused_sequence:
          target: "{{player}}"
          effects:
            - if:
                when: "int(global[param.attempts_key]) >= 2"
                then:
                  - dialogue: "What were you doing snooping around everyone else's paperwork? I almost wrote you up. Anyways, go find the equipment specialist for your Animech training."
                else:
                  - dialogue: "Ah, thank you. Now go find the equipment specialist for your Animech training."
            - mutate_camera:
                follow_entity: "intro.papers_door"
            - timer: 1.5
            - set_global:
                key: intro.papers_turned_in
                value: true
            - timer: 1.5
            - mutate_camera:
                follow_entity: "{{player}}"

  equipment_key_slot_interact:
    description: "Handle key card slot interaction with multi-branch logic"
    params:
      - name: run_state_key
        description: "Run state key for this door slot"
    steps:
      - if:
          when: "param.run_state_key == '' || param.run_state_key == 'not_it'"
          then:
            - if:
                when: "global['intro.has_equipment_key'] == true"
                then:
                  - play_sound: "adventure/beeps/error"
                  - self_dialogue: "Yeah, that key card doesn't work in this slot..."
                else:
                  - self_dialogue: "This looks like a slot for a key card..."
          else:
            - if:
                when: "global['intro.equipment_door_state'] == 'open' || global['intro.equipment_door_state'] == true"
                then:
                  - self_dialogue: "The door is already open."
                else:
                  - if:
                      when: "global['intro.has_equipment_key'] != true"
                      then:
                        - self_dialogue: "This looks like a slot for a key card..."
                      else:
                        - play_sound: "adventure/beeps/success"
                        - self_dialogue: "That worked!"
                        - set_global:
                            key: "{{param.run_state_key}}"
                            value: open

property_templates:
  intro.hallway_npc:
    script_ref: intro.hall_way_npc
    movement: static

handlers:
  hint.listener:
    on_init:
      - when:
          not_run_this_instance:
            key: intro.hints.hint.interact
        steps:
          - set_global:
              key: intro.hints.hint.interact
              value: "{{instance_id}}"
          - timer: 3
          - tooltip: "Press A to interact"
    on_zone_activity:
      - filter:
          zone: "hint.interact"
          entity: "{{player}}"
          entering: true
        when:
          not_run_this_instance:
            key: intro.hints.hint.interact
        steps:
          - set_global:
              key: intro.hints.hint.interact
              value: "{{instance_id}}"
          - timer: 3
          - tooltip: "Press A to interact"
      - filter:
          zone: "hint.run"
          entity: "{{player}}"
          entering: true
        when:
          not_run_this_instance:
            key: intro.hints.hint.run
        steps:
          - set_global:
              key: intro.hints.hint.run
              value: "{{instance_id}}"
          - timer: 3
          - tooltip: "Hold B to run"

  intro.reset:
    on_state_enter:
      - steps:
          - action: reset_intro_state

  intro.not_your_paper:
    on_interact_self:
      - steps:
          - custom_action:
              name: indexed_self_dialogue
              params:
                list: "'not_your_paper_messages'"
                counter_key: "'intro.not_your_paper.attempts'"

  intro.is_your_paper:
    on_interact_self:
      - steps:
          - custom_action:
              name: pick_up_paper
              params:
                attempts_key: "'intro.not_your_paper.attempts'"
                entity_id: "self"

  intro.paper_instructor:
    on_interact_self:
      - when:
          expr: "global['intro.papers_turned_in'] == true"
        steps:
          - focused_sequence:
              target: "{{source}}"
              effects:
                - dialogue: "What do you want? Go find the equipment specialist."
      - when:
          expr: "global['intro.has_papers'] != true"
        steps:
          - focused_sequence:
              target: "{{source}}"
              effects:
                - dialogue: "Are you confused? Fill out your paper work, and give it to me."
      - steps:
          - custom_action:
              name: turn_in_papers
              params:
                attempts_key: "'intro.not_your_paper.attempts'"
    on_zone_activity:
      - filter:
          zone: "papers.instructions"
          entity: "{{player}}"
          entering: true
        when:
          all:
            - expr: "var.blabbed != true"
            - expr: "global['intro.papers_turned_in'] != true"
        steps:
          - set_var:
              key: blabbed
              value: "true"
          - focused_sequence:
              target: "{{player}}"
              move_camera: true
              face_player: true
              effects:
                - chatter:
                    entity: "{{self}}"
                    duration: 3
                    message: "You've gotta fill out your paperwork before you can leave..."

  intro.guarded_entry:
    props:
      - name: zone_id
        type: string
        required: true
        description: "Zone ID that triggers the guard denial on entry"
      - name: walk_back_direction
        type: string
        required: true
        description: "Direction to push the player back (up/down/left/right)"
    on_zone_activity:
      - filter:
          zone: "{{prop.zone_id}}"
          entity: "{{player}}"
          entering: true
        steps:
          - custom_action:
              name: guarded_entry_deny
              params:
                walk_back_direction: "prop.walk_back_direction"
    on_interact_self:
      - steps:
          - custom_action: guarded_entry_chat

  intro.hall_way_npc:
    on_init:
      - steps:
          - push_behavior:
              entity: "{{self}}"
              scripted_motion: true
              active_player_zone: "intro.hallway"
          - custom_action: hall_npc_start_random_motion
    on_interact_self:
      - when:
          not:
            has_face_behavior:
              entity: "{{self}}"
        steps:
          - custom_action: hall_npc_random_chatter
    on_motion_complete_self:
      - filter:
          was_canceled: true
        steps:
          - custom_action:
              name: hall_npc_start_random_motion
              params:
                was_canceled: "true"
      - steps:
          - custom_action: hall_npc_start_random_motion

  intro.equipment_specialist:
    on_interact_self:
      - when:
          expr: "global['intro.has_equipment_key'] == true"
        steps:
          - dialogue: "Do you need help finding testing room 1...?"
      - steps:
          - focused_sequence:
              target: "{{source}}"
              effects:
                - dialogue: "Ah! Hello. Yes, this is the equipment testing facility. No.. No, I'm not a specialist; they're inside the testing rooms."
                - dialogue: "Here, take this key card. They're waiting for you in testing room 1."
                - set_global:
                    key: intro.has_equipment_key
                    value: true

  intro.equipment_door.key_slot:
    props:
      - name: run_state_key
        type: string
        required: true
        description: "Run state key identifying which door slot this is"
    on_interact_self:
      - steps:
          - custom_action:
              name: equipment_key_slot_interact
              params:
                run_state_key: "prop.run_state_key"
